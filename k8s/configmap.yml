apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-ofisy-stock-config
data:
  POSTGRES_HOST: "<RDS_ADDRESS>"
  POSTGRES_DB: "ms_ofisy_stock_db"
  SPRING_PROFILES_ACTIVE: "k8s"
  JAVA_TOOL_OPTIONS: "-javaagent:/app/dd-java-agent.jar -XX:MaxRAMPercentage=75"
  DD_SERVICE: "ms-ofisy-stock"
  DD_ENV: "production"
  DD_VERSION: "<IMAGE_TAG>"
  DD_METRICS_ENABLED: "true"
