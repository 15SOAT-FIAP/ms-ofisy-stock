spring:
  application:
    name: ms-ofisy-stock
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5434/ms_ofisy_stock_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  docker:
    compose:
      file: compose.db.yaml
  config:
    import: optional:file:.env[.properties]
jwt:
  secret: ${JWT_SECRET}
security:
  public-paths:
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**
    - /actuator/health/**
management:
  endpoints:
    web:
      exposure:
        include: health
logging:
  level:
    org.flywaydb: DEBUG